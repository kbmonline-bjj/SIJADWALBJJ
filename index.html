<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Pantauan Jadwal Neutron</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <!-- FontAwesome (Icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .kpi-card { color: white; border-radius: 10px; padding: 20px; }
        .bg-primary-custom { background: linear-gradient(45deg, #0d6efd, #0dcaf0); }
        .bg-success-custom { background: linear-gradient(45deg, #198754, #20c997); }
        .bg-warning-custom { background: linear-gradient(45deg, #fd7e14, #ffc107); }
        /* Style untuk highlight hari ini */
        .card-hari-ini { border-left: 5px solid #0d6efd; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-calendar-alt me-2"></i> SI Pantauan Jadwal & Operasional</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        
        <!-- ======================= -->
        <!-- MULAI: TAMPILAN HARI INI -->
        <!-- ======================= -->
        <div class="card p-4 mb-4 card-hari-ini">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 text-primary"><i class="fas fa-clock me-2"></i>Jadwal Hari Ini</h4>
                <span class="badge bg-primary fs-6" id="tanggalHariIni">Memuat tanggal...</span>
            </div>
            
            <div id="pesanKosong" class="alert alert-warning d-none">
                <i class="fas fa-info-circle me-2"></i>Belum ada jadwal yang dimasukkan untuk hari ini.
            </div>

            <div class="table-responsive" id="tabelHariIniContainer">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>Waktu</th>
                            <th>Pengajar</th>
                            <th>Mapel / Agenda</th>
                            <th>Kelas</th>
                            <th>Studio</th>
                            <th>OP Zoom</th>
                        </tr>
                    </thead>
                    <tbody id="bodyHariIni">
                        <!-- Data khusus hari ini masuk kesini -->
                    </tbody>
                </table>
            </div>
        </div>
        <!-- ======================= -->
        <!-- AKHIR: TAMPILAN HARI INI -->
        <!-- ======================= -->

        <!-- Rekapan Tabel Lengkap (Dibawah informasi hari ini) -->
        <div class="card p-4 mb-5">
            <h5 class="mb-4">Database Seluruh Jadwal</h5>
            <div class="table-responsive">
                <table id="tabelRekapan" class="table table-striped table-hover align-middle w-100">
                    <thead class="table-dark">
                        <tr>
                            <th>Hari Tanggal</th>
                            <th>Waktu</th>
                            <th>Bagian</th>
                            <th>Pengajar</th>
                            <th>Mapel / Agenda</th>
                            <th>Kelas</th>
                            <th>Studio</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // Membuat Tanggal Hari Ini sesuai format CSV (Contoh: "Rabu, 10 Juni 2026")
        const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        
        const tgl = new Date();
        // Cek jika tanggal 1-9, tambahkan angka 0 di depannya agar sesuai CSV (misal 01 Juli)
        let tglAngka = tgl.getDate() < 10 ? '0' + tgl.getDate() : tgl.getDate(); 
        const stringHariIni = `${namaHari[tgl.getDay()]}, ${tglAngka} ${namaBulan[tgl.getMonth()]} ${tgl.getFullYear()}`;
        
        // Tampilkan teks tanggal di pojok kanan atas kartu
        document.getElementById('tanggalHariIni').innerText = stringHariIni;

        // URL Export Google Sheets
        const sheetUrl = "https://docs.google.com/spreadsheets/d/1wNQHGvbtB1rRq0Mjw4g00q849MTZGJE9AFqrfASyqI4/export?format=csv&gid=1652385748";

        Papa.parse(sheetUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                
                let tableHtml = "";
                let htmlHariIni = "";
                let countHariIni = 0;

                data.forEach(row => {
                    if(!row['Hari Tanggal'] && !row['WAKTU']) return;

                    // 1. Masukkan ke Tabel Semua Data
                    tableHtml += `<tr>
                        <td>${row['Hari Tanggal'] || '-'}</td>
                        <td>${row['WAKTU'] || '-'}</td>
                        <td><span class="badge bg-secondary">${row['CBG/BAG'] || '-'}</span></td>
                        <td>${row['PENGAJAR'] || '-'}</td>
                        <td>${row['MAPEL'] || '-'}</td>
                        <td>${row['KELAS'] || '-'}</td>
                        <td>${row['STUDIO'] || '-'}</td>
                    </tr>`;

                    // 2. Filter Khusus Hari Ini
                    if (row['Hari Tanggal'] === stringHariIni) {
                        htmlHariIni += `<tr>
                            <td><strong>${row['WAKTU'] || '-'}</strong></td>
                            <td>${row['PENGAJAR'] || '-'}</td>
                            <td>${row['MAPEL'] || '-'}</td>
                            <td>${row['KELAS'] || '-'}</td>
                            <td><span class="badge bg-info text-dark">${row['STUDIO'] || '-'}</span></td>
                            <td>${row['OP ZOOM'] || '-'}</td>
                        </tr>`;
                        countHariIni++;
                    }
                });

                // Render Tabel Semua Data
                $('#tabelBody').html(tableHtml);
                $('#tabelRekapan').DataTable({ "pageLength": 10 });

                // Render Tabel Hari Ini
                if (countHariIni > 0) {
                    $('#bodyHariIni').html(htmlHariIni);
                } else {
                    // Sembunyikan tabel hari ini dan munculkan pesan kosong jika tidak ada jadwal
                    $('#tabelHariIniContainer').addClass('d-none');
                    $('#pesanKosong').removeClass('d-none');
                }
            }
        });
    </script>
</body>
</html>
