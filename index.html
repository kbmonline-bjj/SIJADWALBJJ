<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Pantauan Jadwal Neutron</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .studio-card { height: 100%; border-top: 4px solid #0d6efd; }
        .jadwal-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .jadwal-item:last-child { border-bottom: none; }
        .bentrok-alert { background-color: #f8d7da; border-left: 4px solid #dc3545; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-calendar-alt me-2"></i> SI Pantauan Jadwal & Operasional</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        
        <!-- ======================= -->
        <!-- FILTER TANGGAL (KALENDER) -->
        <!-- ======================= -->
        <div class="card p-4 mb-4">
            <div class="row align-items-center">
                <div class="col-md-5">
                    <h5 class="mb-0"><i class="fas fa-search me-2"></i>Cek Ketersediaan Studio</h5>
                    <p class="text-muted small mb-0 mt-1">Klik ikon kalender untuk memilih tanggal dan melihat jadwal studio.</p>
                </div>
                <div class="col-md-4 mt-3 mt-md-0">
                    <!-- Ini yang diubah menjadi input kalender -->
                    <input type="date" id="pilihTanggal" class="form-control form-control-lg text-primary fw-bold cursor-pointer">
                </div>
            </div>
        </div>

        <!-- ======================= -->
        <!-- AREA STUDIO (OTOMATIS) -->
        <!-- ======================= -->
        <div id="peringatanBentrokUtama" class="alert alert-danger d-none fw-bold shadow-sm">
            <i class="fas fa-exclamation-triangle me-2"></i> PERHATIAN: Ditemukan jadwal yang bentrok (waktu tumpang tindih) pada tanggal ini!
        </div>

        <div id="peringatanKosong" class="alert alert-info d-none shadow-sm">
            <i class="fas fa-info-circle me-2"></i> Tidak ada jadwal yang terdaftar pada tanggal yang Anda pilih.
        </div>

        <div class="row mb-5" id="areaStudio">
            <!-- Kartu Studio akan di-generate oleh JavaScript disini -->
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/1wNQHGvbtB1rRq0Mjw4g00q849MTZGJE9AFqrfASyqI4/export?format=csv&gid=1652385748";
        let globalData = [];

        // Konfigurasi Nama Hari & Bulan untuk konversi format Indonesia
        const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        // Konversi dari kalender (YYYY-MM-DD) ke format CSV (Rabu, 10 Juni 2026)
        function formatKeCSV(dateStr) {
            if(!dateStr) return "";
            let [y, m, d] = dateStr.split('-');
            const tgl = new Date(y, m - 1, d);
            let hari = namaHari[tgl.getDay()];
            let bulan = namaBulan[tgl.getMonth()];
            return `${hari}, ${d} ${bulan} ${y}`;
        }

        // Konversi dari format CSV (Rabu, 10 Juni 2026) ke kalender (YYYY-MM-DD)
        function formatDariCSV(csvDateStr) {
            let parts = csvDateStr.split(','); 
            if(parts.length < 2) return "";
            let dateParts = parts[1].trim().split(' ');
            let d = dateParts[0].padStart(2, '0');
            let mIndex = namaBulan.indexOf(dateParts[1]) + 1;
            let m = mIndex.toString().padStart(2, '0');
            let y = dateParts[2];
            return `${y}-${m}-${d}`;
        }

        // Fungsi mengubah teks waktu (13.00-13.30) menjadi menit untuk deteksi bentrok
        function parseWaktuToMinutes(waktuStr) {
            let match = waktuStr.match(/(\d{1,2})[\.\:](\d{2})\s*-\s*(\d{1,2})[\.\:](\d{2})/);
            if (match) {
                return {
                    start: parseInt(match[1]) * 60 + parseInt(match[2]),
                    end: parseInt(match[3]) * 60 + parseInt(match[4])
                };
            }
            return null;
        }

        Papa.parse(sheetUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                globalData = results.data.filter(row => row['Hari Tanggal'] && row['Hari Tanggal'].trim() !== '');
                
                // Ambil daftar tanggal pertama dari data untuk diset sebagai nilai awal kalender
                let tanggalUnik = [...new Set(globalData.map(item => item['Hari Tanggal']))];
                if(tanggalUnik.length > 0) {
                    let kalenderFormatAwal = formatDariCSV(tanggalUnik[0]);
                    $('#pilihTanggal').val(kalenderFormatAwal).change();
                }
            }
        });

        // Saat tanggal di kalender dipilih/berubah
        $('#pilihTanggal').on('change', function() {
            let selectedDateVal = $(this).val(); 
            if(!selectedDateVal) return;

            // Terjemahkan tanggal kalender menjadi teks Indonesia agar cocok dengan spreadsheet
            let tglPencarianCSV = formatKeCSV(selectedDateVal);

            let dataHariIni = globalData.filter(row => row['Hari Tanggal'] === tglPencarianCSV);
            let jadwalPerStudio = {};

            // Bersihkan tampilan sebelumnya
            $('#areaStudio').empty();
            $('#peringatanBentrokUtama').addClass('d-none');
            $('#peringatanKosong').addClass('d-none');

            if(dataHariIni.length === 0) {
                $('#peringatanKosong').removeClass('d-none');
                return;
            }

            // Kelompokkan jadwal berdasarkan Studio
            dataHariIni.forEach(row => {
                let namaStudio = row['STUDIO'] ? row['STUDIO'].trim() : 'Studio Tidak Disebutkan';
                if(!jadwalPerStudio[namaStudio]) { jadwalPerStudio[namaStudio] = []; }
                jadwalPerStudio[namaStudio].push(row);
            });

            let htmlStudio = "";
            let adaBentrokGlobal = false;

            // Render Kartu per Studio
            Object.keys(jadwalPerStudio).sort().forEach(studio => {
                let sesiStudio = jadwalPerStudio[studio];
                
                // Urutkan jadwal dari pagi ke sore otomatis
                sesiStudio.sort((a, b) => {
                    let wA = parseWaktuToMinutes(a['WAKTU'] || "");
                    let wB = parseWaktuToMinutes(b['WAKTU'] || "");
                    return (wA && wB) ? (wA.start - wB.start) : 0;
                });

                let htmlSesi = "";
                let endSebelumnya = 0;

                // Proses deteksi bentrok
                sesiStudio.forEach((sesi) => {
                    let waktuParsed = parseWaktuToMinutes(sesi['WAKTU'] || "");
                    let isBentrok = false;

                    if (waktuParsed) {
                        if (waktuParsed.start < endSebelumnya) {
                            isBentrok = true;
                            adaBentrokGlobal = true;
                        }
                        if (waktuParsed.end > endSebelumnya) { endSebelumnya = waktuParsed.end; }
                    }

                    htmlSesi += `
                        <div class="jadwal-item ${isBentrok ? 'bentrok-alert' : ''}">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <strong><i class="far fa-clock me-1"></i> ${sesi['WAKTU'] || '-'}</strong>
                                <span class="badge bg-secondary">${sesi['KELAS'] || '-'}</span>
                            </div>
                            <div class="fw-bold text-primary">${sesi['MAPEL'] || '-'}</div>
                            <div class="text-muted small">
                                <i class="fas fa-user-tie me-1"></i> ${sesi['PENGAJAR'] || '-'} <br>
                                <i class="fas fa-headset me-1"></i> OP: ${sesi['OP ZOOM'] || '-'}
                            </div>
                            ${isBentrok ? '<div class="text-danger small fw-bold mt-1"><i class="fas fa-times-circle me-1"></i> Bentrok Waktu!</div>' : ''}
                        </div>
                    `;
                });

                htmlStudio += `
                    <div class="col-md-6 col-lg-3 mb-4">
                        <div class="card studio-card p-3">
                            <h5 class="text-center mb-3 text-uppercase border-bottom pb-2">${studio}</h5>
                            <div class="sesi-container">
                                ${htmlSesi}
                            </div>
                        </div>
                    </div>
                `;
            });

            $('#areaStudio').html(htmlStudio);

            if (adaBentrokGlobal) { $('#peringatanBentrokUtama').removeClass('d-none'); }
        });
    </script>
</body>
</html>
